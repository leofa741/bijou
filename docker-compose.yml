services:
  pretty-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MONGODB_CNN: ${MONGODB_CNN}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
    container_name: pretty-witches-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    networks:
      - pretty-network

networks:
  pretty-network:
    driver: bridge