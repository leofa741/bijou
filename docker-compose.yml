version: '3.8'

services:
  candy-app:
    build:
      context: .
      dockerfile: Dockerfile
      # ✅ 3. PASAR LAS VARIABLES DEL .env AL PROCESO DE BUILD
      args:
        MONGODB_CNN: ${MONGODB_CNN}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
    container_name: candy-ilusiones-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production 
    networks:
      - candy-network

networks:
  candy-network:
    driver: bridge